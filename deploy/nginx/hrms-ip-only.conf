# Temporary HTTP-only config when you have no domain yet (NOT for production long-term).
# Use only for initial smoke tests, then switch to hrms.conf + HTTPS.

upstream hrms_api {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25m;
    root /var/www/hrms/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://hrms_api;
    }

    # pdf.js worker (.mjs) — required for Halal PDF certificate backgrounds
    location ~* \.mjs$ {
        default_type application/javascript;
        types { }
        add_header Content-Type "application/javascript; charset=utf-8" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
