# Nginx site for Oromia Majlis HRMS
# Install: sudo cp deploy/nginx/hrms.conf /etc/nginx/sites-available/hrms
#          sudo ln -sf /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace SERVER_NAME with your domain or use the VPS IP for initial testing.

upstream hrms_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# HTTP → HTTPS redirect (enable after Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name hrms.yourdomain.gov.et;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hrms.yourdomain.gov.et;

    # Certbot fills these paths after: certbot --nginx -d hrms.yourdomain.gov.et
    ssl_certificate     /etc/letsencrypt/live/hrms.yourdomain.gov.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.yourdomain.gov.et/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25m;

    root /var/www/hrms/frontend/dist;
    index index.html;

    # API reverse proxy
    location /api/ {
        proxy_pass http://hrms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (optional external monitor)
    location /health {
        proxy_pass http://hrms_api;
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block dotfiles
    location ~ /\. {
        deny all;
    }
}
