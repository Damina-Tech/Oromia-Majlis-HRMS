# HTTP-only — use BEFORE first certbot run, then certbot --nginx adds SSL.
# Install:
#   sed 's/hrms.yourdomain.gov.et/system.oriasc.org/g' deploy/nginx/hrms-certbot-init.conf \
#     | sudo tee /etc/nginx/sites-available/hrms
#   sudo ln -sf /etc/nginx/sites-available/hrms /etc/nginx/sites-enabled/hrms
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d system.oriasc.org

upstream hrms_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hrms.yourdomain.gov.et;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 25m;
    root /var/www/hrms/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://hrms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://hrms_api;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
