version: "3.8"

services:
  db:
    image: postgres:16
    env_file:
      - ./docker.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chiro_hrms
    ports:
      - "5433:5432"   # ← changed host port to 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
